# Tests the app and builds what a release holds: the Windows installer (MSI), the portable Windows
# zip, the Android app (APK) and the iPhone app (an unsigned IPA, signed by whoever installs it). A pushed tag v* publishes all three as a GitHub release; other runs
# keep them as artifacts. A manual run with `release` set replaces the files of that existing release.
name: Release builds

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release:
        description: Existing release tag whose files to replace (empty = artifacts only)
        required: false
        default: ''

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npx playwright install chromium
      - run: npm run test:editor
      # sign-in with Google (sync): the desktop client's secret travels with the app, not in the repository
      - name: Google client
        shell: pwsh
        env:
          SECRET: ${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}
        run: |
          if ($env:SECRET) {
            @{ client_secret = $env:SECRET } | ConvertTo-Json | Set-Content -Encoding utf8 server/google-client.json
          } else {
            "::warning::GOOGLE_DESKTOP_CLIENT_SECRET is not set: this build cannot sign in to Google (sync is off)"
          }
      - run: node scripts/stage.mjs

      - name: Version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Build the MSI
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          New-Item -ItemType Directory -Force out | Out-Null
          # absolute: WiX resolves <Files Include> against the .wxs folder, not the working directory
          $stage = (Resolve-Path out/stage).Path
          $msi = "out/ATLASTaker-${{ steps.version.outputs.value }}-x64.msi"
          wix build installer/ATLASTaker.wxs -arch x64 `
            -d Version=${{ steps.version.outputs.value }} `
            -d "StageDir=$stage" `
            -o $msi
          # an MSI that found no files still builds; the app and its Node weigh tens of megabytes
          $size = (Get-Item $msi).Length
          if ($size -lt 20MB) { throw "MSI is only $size bytes: the app files were not picked up" }
          "MSI: $([math]::Round($size / 1MB, 1)) MB"

      # the same files as the MSI, plus a start file and a note, in a folder that runs from anywhere
      - name: Portable zip
        shell: pwsh
        run: |
          $portable = "out/portable/ATLAS Notetaker"
          New-Item -ItemType Directory -Force $portable | Out-Null
          Copy-Item -Recurse out/stage/* $portable
          Copy-Item installer/portable/* $portable
          Compress-Archive -Path $portable -DestinationPath out/ATLASTaker-${{ steps.version.outputs.value }}-portable.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            out/*.msi
            out/*.zip

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: node scripts/android-assets.mjs
      # the scanner's native libraries (ncnn, opencv-mobile), checked against their SHA-256, and the
      # OCR models in the APK checked too
      - uses: actions/cache@v4
        with:
          path: android/app/src/main/cpp/third_party
          key: ocr-deps-${{ hashFiles('scripts/android-ocr-deps.mjs') }}
      - run: node scripts/android-ocr-deps.mjs

      # Phones take an APK as an update only when its versionCode (from package.json) is higher than the
      # one they have: a tag must name package.json's version, and that must be newer than the last release.
      - name: Check the version goes up
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "${{ github.ref_name }}" ]; then
            echo "::error::the tag is ${{ github.ref_name }} but package.json says $version"
            exit 1
          fi
          previous=$(gh release view --repo "${{ github.repository }}" --json tagName -q .tagName 2>/dev/null || echo v0.0.0)
          node -e '
            const [a, b] = process.argv.slice(1).map((v) => v.replace(/^v/, "").split(".").map(Number));
            for (let i = 0; i < 3; i++) if (a[i] !== b[i]) process.exit(a[i] > b[i] ? 0 : 1);
            process.exit(1);
          ' "$version" "$previous" || { echo "::error::$version is not newer than the published $previous: phones would refuse it as an update"; exit 1; }
          echo "$previous → $version"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # The release key comes from the repository's secrets. A release must be signed with it, or
      # phones that have ATLAS would refuse the update; other runs may fall back to the debug key.
      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.release != '' }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/atlas.p12"
            echo "ATLAS_KEYSTORE=$RUNNER_TEMP/atlas.p12" >> "$GITHUB_ENV"
          elif [ "$RELEASE" = "true" ]; then
            echo "::error::ANDROID_KEYSTORE_B64 is not set: a release APK must be signed with the release key"
            exit 1
          else
            echo "::warning::no release key: this APK is signed with a debug key"
          fi

      - name: Build the APK
        env:
          ATLAS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          gradle -p android assembleRelease --no-daemon --stacktrace
          version=$(node -p "require('./package.json').version")
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/ATLASTaker-$version-android.apk"
          ls -l out

      # An APK signed with any other key would be refused over the installed one (and tempt people to
      # remove the app, notes and all): a release carries the release key's certificate or does not go out.
      - name: Check the signing key
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          certs=$("$apksigner" verify --print-certs out/*.apk)
          echo "$certs"
          echo "$certs" | grep -qi "SHA-256 digest: 5a267d11ec0c81a8fdcff3768d60a6e70a2ba4bf9f1b3cbd1b5011b765c1c511" \
            || { echo "::error::the APK is not signed with the release key: phones would refuse it as an update"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/*.apk

  # The iPhone app: the same page in a WKWebView (ios/), built unsigned — an Apple ID signs it when it is
  # installed (Sideloadly, AltStore, SideStore). A release goes out without it if it does not build.
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: node scripts/ios-assets.mjs

      - name: The Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Build the IPA
        run: |
          version=$(node -p "require('./package.json').version")
          # a build number that only goes up: 0.19.9 → 1909
          build=$(node -p "require('./package.json').version.split('.').reduce((n, p) => n * 100 + Number(p), 0)")
          xcodebuild -project ios/ATLASTaker.xcodeproj -target ATLASTaker -configuration Release -sdk iphoneos             SYMROOT="$PWD/ios/build" MARKETING_VERSION="$version" CURRENT_PROJECT_VERSION="$build"             CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          app=ios/build/Release-iphoneos/ATLASTaker.app
          test -f "$app/www/index.html" || { echo "::error::the page is not in the app"; exit 1; }
          mkdir -p out/ipa/Payload
          cp -R "$app" out/ipa/Payload/
          (cd out/ipa && zip -qry "../ATLASTaker-$version-ios.ipa" Payload)
          ls -l out/*.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: out/*.ipa

  publish:
    needs: [windows, android, ios]
    # the Windows and Android builds must pass; the iPhone one is welcome but not required yet
    if: >-
      always() && needs.windows.result == 'success' && needs.android.result == 'success' &&
      (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release != ''))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      # what each file must hash to: a download can be checked (the app checks the APK itself)
      - name: Checksums
        run: |
          cd out
          rm -f SHA256SUMS.txt
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" out/* --repo "${{ github.repository }}" --title "ATLAS Notetaker ${{ github.ref_name }}" --generate-notes

      - name: Replace the files of an existing release
        if: github.event_name == 'workflow_dispatch' && inputs.release != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.release }}" out/* --repo "${{ github.repository }}" --clobber
