# Tests the app, then packs it as a Windows installer (MSI) and a portable zip.
# A pushed tag v* also publishes both as a GitHub release; other runs keep them as artifacts.
# A manual run with `release` set replaces the files of that existing release.
name: Windows installer

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release:
        description: Existing release tag whose files to replace (empty = artifacts only)
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: node scripts/stage.mjs

      - name: Version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Build the MSI
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          New-Item -ItemType Directory -Force out | Out-Null
          # absolute: WiX resolves <Files Include> against the .wxs folder, not the working directory
          $stage = (Resolve-Path out/stage).Path
          $msi = "out/ATLASTaker-${{ steps.version.outputs.value }}-x64.msi"
          wix build installer/ATLASTaker.wxs -arch x64 `
            -d Version=${{ steps.version.outputs.value }} `
            -d "StageDir=$stage" `
            -o $msi
          # an MSI that found no files still builds; the app and its Node weigh tens of megabytes
          $size = (Get-Item $msi).Length
          if ($size -lt 20MB) { throw "MSI is only $size bytes: the app files were not picked up" }
          "MSI: $([math]::Round($size / 1MB, 1)) MB"

      - name: Portable zip
        shell: pwsh
        run: Compress-Archive -Path out/stage/* -DestinationPath out/ATLASTaker-${{ steps.version.outputs.value }}-portable.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ATLASTaker-${{ steps.version.outputs.value }}
          path: |
            out/*.msi
            out/*.zip

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" out/*.msi out/*.zip --title "ATLAS Notetaker ${{ github.ref_name }}" --generate-notes

      - name: Replace the files of an existing release
        if: github.event_name == 'workflow_dispatch' && inputs.release != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.release }}" out/*.msi out/*.zip --clobber
